name: Release

on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  release:
    name: Build & Create GitHub Release
    runs-on: ubuntu-latest
    needs: [ci]
    # NOTE: stiva is not published to crates.io — it depends on AGNOS crates
    # whose Rust versions are git-pinned (kavach tag 2.0.0, agnosys tag 0.50.0
    # in the renamed agnodrm repo) and never published. The 2.1.0 release is a
    # git-tag + built-binary artifact release. Re-add a `publish` job only once
    # those deps are available on crates.io.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify version consistency
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          TAG_VERSION="${GITHUB_REF_NAME}"
          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: VERSION ($FILE_VERSION) != tag ($TAG_VERSION)"
            exit 1
          fi
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: Cargo.toml ($CARGO_VERSION) != tag ($TAG_VERSION)"
            exit 1
          fi
          echo "Version verified: $TAG_VERSION"
      - name: Build release binary
        run: cargo build --release --features full
      - name: Package artifacts
        run: |
          mkdir -p dist
          BIN="stiva-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu"
          cp target/release/stiva "dist/${BIN}"
          (cd dist && sha256sum "${BIN}" > SHA256SUMS)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/stiva-*
            dist/SHA256SUMS
