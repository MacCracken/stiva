name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:   # reusable: release.yml gates on this CI workflow

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 (pinned — CVE-21)

      - name: Install Cyrius toolchain
        # The cyrius.cyml [package].cyrius pin is the single source of
        # truth for the toolchain version — never hardcode it here. Read
        # the pin and hand it to the canonical upstream installer, which
        # fetches + lays out $HOME/.cyrius/{bin,lib}. Do NOT hand-roll
        # curl+tar+cp — scripts/install.sh is the supported entry point
        # (matches patra / sigil).
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: cyrius deps

      - name: Verify the vendored files match the pinned tags
        # A local `path = "../<dep>"` override SILENTLY WINS over the `tag` pin —
        # that is how kavach 3.8.1 once arrived unannounced — and cyrius.lock
        # records no dep name or version, so it cannot detect the substitution.
        #
        # Compares the sorted SET of `<sha256>  lib/<file>` lines, ignoring the
        # `commit …` header lines and their order. That comparison is the whole
        # point: cyrius.lock's FORMAT depends on the resolution mode. Resolving
        # from git tags (what CI does) writes `commit <sha> <name> <url> <tag>`
        # lines and a different hash ordering; resolving through path overrides
        # (local development) writes only file hashes. A plain
        # `git diff --exit-code cyrius.lock` therefore compares two structurally
        # different files and fails unconditionally — it was tried, it broke the
        # build, and it was reverted.
        #
        # The file hashes are the part that means the same thing in both modes,
        # and they answer the real question: are the files the tags produce the
        # files the lock records?
        run: |
          hashes () { grep -E '^[0-9a-f]{64}[[:space:]]' "$1" | sort; }
          git show HEAD:cyrius.lock > /tmp/lock.committed
          if ! diff <(hashes /tmp/lock.committed) <(hashes cyrius.lock); then
            echo "::error::The vendored lib/ does not match what the pinned tags resolve to." >&2
            echo "A local 'path = \"../<dep>\"' override probably vendored something the tag does not." >&2
            echo "Bump the tag (or re-resolve without the override) and commit cyrius.lock." >&2
            exit 1
          fi
          echo "cyrius.lock file hashes match the tag-resolved lib/"

      - name: Build
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/${{ github.event.repository.name }}

      - name: Test
        # v5.6.28: bare `cyrius test` picks up the [build].test entry
        # AND auto-discovers tests/*.tcyr — avoids the previous
        # `cyrius test src/test.cyr` form that hard-failed when the
        # stub didn't exist (Issue 1) and also wouldn't ever exercise
        # tests/${proj}.tcyr.
        run: cyrius test
