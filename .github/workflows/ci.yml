name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:   # reusable: release.yml gates on this CI workflow

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 (pinned — CVE-21)

      - name: Install Cyrius toolchain
        # The cyrius.cyml [package].cyrius pin is the single source of
        # truth for the toolchain version — never hardcode it here. Read
        # the pin and hand it to the canonical upstream installer, which
        # fetches + lays out $HOME/.cyrius/{bin,lib}. Do NOT hand-roll
        # curl+tar+cp — scripts/install.sh is the supported entry point
        # (matches patra / sigil).
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: cyrius deps

      - name: Verify the lockfile matches what CI resolved
        # The detector docs/development/roadmap.md asks for. Local development
        # uses `path = "../<dep>"` overrides, which SILENTLY WIN over the `tag`
        # pin — that is how kavach 3.8.1 once arrived unannounced. cyrius.lock
        # records only `<sha256>  lib/<file>` lines, with no dep name or version,
        # so it cannot detect the substitution by itself.
        #
        # CI has no sibling checkouts, so it resolves from the tags. If the
        # committed lock differs from what the tags produce, the lock was
        # generated against something else and the pin does not describe the
        # build.
        #
        # `cyrius deps --verify` alone would be a no-op here: the step above just
        # rewrote the lock, so it would trivially agree with itself.
        run: |
          if ! git diff --exit-code cyrius.lock; then
            echo "::error::cyrius.lock does not match what the pinned tags resolve to." >&2
            echo "A local 'path = \"../<dep>\"' override probably vendored something the tag does not." >&2
            echo "Re-run 'cyrius deps' without the overrides (or bump the tag) and commit the lock." >&2
            exit 1
          fi
          cyrius deps --verify

      - name: Build
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/${{ github.event.repository.name }}

      - name: Test
        # v5.6.28: bare `cyrius test` picks up the [build].test entry
        # AND auto-discovers tests/*.tcyr — avoids the previous
        # `cyrius test src/test.cyr` form that hard-failed when the
        # stub didn't exist (Issue 1) and also wouldn't ever exercise
        # tests/${proj}.tcyr.
        run: cyrius test
