name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:   # reusable: release.yml gates on this CI workflow

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 (pinned — CVE-21)

      - name: Install Cyrius toolchain
        # The cyrius.cyml [package].cyrius pin is the single source of
        # truth for the toolchain version — never hardcode it here. Read
        # the pin and hand it to the canonical upstream installer, which
        # fetches + lays out $HOME/.cyrius/{bin,lib}. Do NOT hand-roll
        # curl+tar+cp — scripts/install.sh is the supported entry point
        # (matches patra / sigil).
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: cyrius deps

      - name: Verify the dep bundles match the pinned tags
        # A local `path = "../<dep>"` override SILENTLY WINS over the `tag` pin —
        # that is how kavach 3.8.1 once arrived unannounced — and cyrius.lock
        # records no dep name or version, so it cannot detect the substitution.
        #
        # Scoped to the files a [deps.*] entry OWNS (its `modules` basenames):
        #
        #  1. cyrius.lock's FORMAT depends on the resolution mode. Tag resolution
        #     (CI) writes `commit <sha> <name> <url> <tag>` header lines and a
        #     different hash ordering; path overrides (local) write only file
        #     hashes. A plain `git diff --exit-code cyrius.lock` compares two
        #     structurally different files and fails unconditionally — tried,
        #     broke the build, reverted.
        #  2. Most of lib/ is the STDLIB subset vendored from the cyrius
        #     toolchain snapshot, not from any git dep. That set legitimately
        #     differs between a developer's `cyrius lib sync` state and a fresh
        #     CI install, so comparing all of lib/ reports drift unrelated to any
        #     dep pin. (It did: sigil_*/hashmap_fast/sha1.)
        #
        # What remains is the question worth asking: do the dep bundles the tags
        # produce match the ones the lock records?
        run: |
          python3 - <<'PY'
          import re, sys, subprocess
          # Line-based: a [deps.NAME] section runs until the next line starting with '['.
          # A regex block match cannot be used — `modules = ["dist/x.cyr"]` contains '[',
          # so a `[^\[]*` block stops before ever reaching the module list.
          owned, in_deps = set(), False
          for line in open('cyrius.cyml'):
              st = line.strip()
              if st.startswith('['):
                  in_deps = st.startswith('[deps.')
                  continue
              if in_deps:
                  for mod in re.findall(r'"([^"]+\.cyr)"', st):
                      owned.add('lib/' + mod.split('/')[-1])
          def hashes(text):
              out = {}
              for line in text.splitlines():
                  m = re.match(r'^([0-9a-f]{64})\s+(lib/\S+)$', line)
                  if m and m.group(2) in owned:
                      out[m.group(2)] = m.group(1)
              return out
          committed = hashes(subprocess.run(['git','show','HEAD:cyrius.lock'],
                                            capture_output=True, text=True).stdout)
          resolved = hashes(open('cyrius.lock').read())
          bad = []
          for f in sorted(set(committed) | set(resolved)):
              if committed.get(f) != resolved.get(f):
                  bad.append(f"  {f}: lock={committed.get(f,'(absent)')[:12]} tags={resolved.get(f,'(absent)')[:12]}")
          if bad:
              print("::error::Dep bundles do not match the pinned tags:", file=sys.stderr)
              print("\n".join(bad), file=sys.stderr)
              # Two causes, and the message used to assert only the second — which
              # cost a debugging cycle in 3.0.18, where the real cause was (1) and
              # the operator was sent looking for an override that did not exist.
              # Order matters: (1) is the common one and the cheap one to check.
              print("", file=sys.stderr)
              print("Most likely: the LOCK IS STALE. A `tag` in cyrius.cyml was bumped without", file=sys.stderr)
              print("re-running `cyrius deps`, so cyrius.lock still records the previous release.", file=sys.stderr)
              print("Check: does the `commit ... <dep> ... <tag>` line in cyrius.lock name the same", file=sys.stderr)
              print("version as its [deps.<dep>] tag? If not, run `cyrius deps` and commit the lock.", file=sys.stderr)
              print("", file=sys.stderr)
              print("Otherwise: a local 'path = \"../<dep>\"' override vendored something the tag does", file=sys.stderr)
              print("not. Tag the sibling (and bump the pin), or re-resolve without the override.", file=sys.stderr)
              sys.exit(1)
          print(f"{len(resolved)} dep bundle(s) match their pinned tags")

          PY
      - name: Verify dist/ regenerates byte-identical (bundle + .deps sidecar)
        # 3.0.21: kavach <= 3.12.8 and stiva both declared `struct AuditEntry`,
        # so `cyrius distlib` refused the sidecar (exit 1) while Build and Test
        # stayed green — nothing here ran distlib, so the break was invisible.
        run: |
          cyrius distlib
          git diff --exit-code -- dist/

      - name: Docs state the pins cyrius.cyml declares
        # 3.0.21: the pin moved 6.6.2 -> 6.6.10 and kavach 3.12.5 -> 3.13.1, but
        # CLAUDE.md, README, CONTRIBUTING, quick-start and state.md still said
        # toolchain 6.5.33 and the dep pins of 3.0.17. Every current-pin
        # statement below must equal cyrius.cyml.
        run: |
          python3 - <<'PY'
          import re, sys
          cyml = open("cyrius.cyml").read()
          tool = re.search(r'^cyrius = "([^"]+)"', cyml, re.M).group(1)
          tags = dict(re.findall(r'^\[deps\.([\w-]+)\][^\[]*?^tag = "([^"]+)"', cyml, re.M | re.S))
          rd = lambda p: open(p).read()
          claims = []  # (where, what, stated, declared)
          for p, rx in [("CLAUDE.md", r"\*\*Toolchain\*\*: Cyrius, pin \*\*([\d.]+)\*\*"),
                        ("CLAUDE.md", r"built, pin \*\*([\d.]+)\*\*"),
                        ("README.md", r"[Tt]oolchain pin \*\*([\d.]+)\*\*"),
                        ("CONTRIBUTING.md", r"pinned to \*\*([\d.]+)\*\*"),
                        ("docs/development/state.md", r"\*\*Cyrius pin\*\*: `([\d.]+)`"),
                        ("docs/guides/quick-start.md", r"\(pin ([\d.]+)\)")]:
              hits = re.findall(rx, rd(p))
              if not hits: claims.append((p, "toolchain", "<missing>", tool))
              claims += [(p, "toolchain", v, tool) for v in hits]
          claude = rd("CLAUDE.md")
          for dep, v in re.findall(r"^\| ([\w-]+) \|[^\n]*— pin \*\*([\d.]+)\*\* \|$", claude, re.M):
              claims.append(("CLAUDE.md Stack", dep, v, tags.get(dep, "<not a dep>")))
          m = re.search(r"^\| sakshi · libro \|[^\n]*pins \*\*([\d.]+)\*\* / \*\*([\d.]+)\*\*", claude, re.M)
          claims += [("CLAUDE.md Stack", "sakshi", m.group(1) if m else "<missing>", tags["sakshi"]),
                     ("CLAUDE.md Stack", "libro", m.group(2) if m else "<missing>", tags["libro"])]
          for dep, v in re.findall(r"\| ([\w-]+) \| ([\d.]+)(?: \([^)]*\))? (?=\|)", rd("docs/development/state.md")):
              claims.append(("state.md deps", dep, v, tags.get(dep, "<not a dep>")))
          bad = [c for c in claims if c[2] != c[3]]
          for w, what, st, dec in bad:
              print(f"::error::{w}: {what} stated {st}, cyrius.cyml declares {dec}")
          print(f"{len(claims)} pin statement(s) checked, {len(bad)} stale")
          sys.exit(1 if bad else 0)
          PY

      - name: Build
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/${{ github.event.repository.name }}

      - name: Test
        # v5.6.28: bare `cyrius test` picks up the [build].test entry
        # AND auto-discovers tests/*.tcyr — avoids the previous
        # `cyrius test src/test.cyr` form that hard-failed when the
        # stub didn't exist (Issue 1) and also wouldn't ever exercise
        # tests/${proj}.tcyr.
        run: cyrius test
