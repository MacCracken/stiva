# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []
features = ["full"]

[advisories]
# No ignores: the formerly-unmaintained proc-macro-error2 (RUSTSEC-2026-0173)
# was dropped entirely by updating its parent getset 0.1.6 → 0.1.7 (build-time
# proc-macro under oci-spec → kavach), so no advisory needs suppressing.
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "GPL-3.0-or-later",
    "GPL-3.0-only",
    "Zlib",
    "Apache-2.0 WITH LLVM-exception",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# AGNOS crates whose required Rust versions were never published to crates.io
# (the repos moved to Cyrius). Pinned by tag in Cargo.toml; Cargo.lock records
# the exact commit. kavach = tag 2.0.0; agnosys = tag 0.50.0 in the renamed
# agnodrm repo (the `encrypted` feature only).
allow-git = [
    "https://github.com/MacCracken/kavach",
    "https://github.com/MacCracken/agnodrm",
]
